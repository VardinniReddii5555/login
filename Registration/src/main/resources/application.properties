spring.application.name=Registration

server.port=9090

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.context-path=/
management.endpoints.web.exposure.include=health


spring.datasource.url = jdbc:postgresql://localhost:5432/Registration_Form
spring.datasource.username=postgres
spring.datasource.password=1515
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql = true
spring.jpa.format-sql =true


# OIDC OAuth2 provider configuration


# Client details (manager will give these)
spring.security.oauth2.client.registration.univ.client-id=YOUR_CLIENT_ID
spring.security.oauth2.client.registration.univ.client-secret=YOUR_CLIENT_SECRET

spring.security.oauth2.client.registration.univ.scope=openid,profile,email
spring.security.oauth2.client.registration.univ.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.univ.redirect-uri=http://localhost:9090/*

# Provider endpoints from manager
spring.security.oauth2.client.provider.univ.authorization-uri=https://securepass.emudhra.com/SPAuthPage/oauth/authorize
spring.security.oauth2.client.provider.univ.token-uri=https://securepass.emudhra.com/SPAuthPage/oauth/token


spring.security.oauth2.client.provider.univ.user-name-attribute=sub
